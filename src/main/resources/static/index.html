<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radio Gaga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --surface: #181818;
            --raised: #282828;
            --hover: #2a2a2a;
            --text: #ffffff;
            --muted: #b3b3b3;
            --green: #1db954;
            --green-bright: #1ed760;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #1f2a22 0, var(--bg) 340px);
            background-color: var(--bg);
            color: var(--text);
            font: 400 1rem/1.5 "Figtree", system-ui, sans-serif;
        }

        button,
        input {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 3px;
        }

        .studio {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px 20px 48px;
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
            gap: 24px;
            align-items: start;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
        }

        /* Top bar: clock, meters, name and the "On air" light */
        .wall {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 28px;
            padding: 18px 24px;
        }

        .clock time {
            display: block;
            font: 800 2.4rem/1 "Figtree", sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .clock span {
            font-size: .9rem;
            color: var(--muted);
        }

        .meters {
            display: flex;
            gap: 5px;
        }

        .meter {
            position: relative;
            width: 12px;
            height: 56px;
            border-radius: 6px;
            overflow: hidden;
            background: linear-gradient(to top, var(--green) 0%, var(--green-bright) 100%);
        }

        .meter i {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 100%;
            background: var(--raised);
            transition: height .12s linear;
        }

        h1 {
            margin: 0 auto 0 0;
            font: 800 clamp(2rem, 5vw, 3.2rem)/1 "Figtree", sans-serif;
            letter-spacing: -0.02em;
        }

        .onair {
            padding: 10px 22px;
            border-radius: 999px;
            background: var(--raised);
            color: #6a6a6a;
            font-weight: 800;
            transition: background .2s, color .2s, box-shadow .2s;
        }

        .playing .onair {
            background: var(--green);
            color: #000;
            box-shadow: 0 0 28px rgba(29, 185, 84, .55);
        }

        /* Turntable */
        .deck {
            container-type: inline-size;
            position: relative;
            aspect-ratio: 4 / 3;
            border-radius: 16px;
            background: linear-gradient(160deg, #2c2c2c 0%, var(--surface) 100%);
            box-shadow: 0 24px 48px rgba(0, 0, 0, .5);
        }

        .platter {
            position: absolute;
            left: 6cqw;
            top: 7.5cqw;
            width: 60cqw;
            height: 60cqw;
            border-radius: 50%;
            background: radial-gradient(circle, #3a3a3a 0%, #4a4a4a 60%, #333 100%);
            box-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, .6);
        }

        .record {
            position: absolute;
            inset: 2cqw;
            border-radius: 50%;
            background:
                conic-gradient(from 20deg, transparent 0 8%, rgba(255, 255, 255, .10) 12%, transparent 18% 58%, rgba(255, 255, 255, .08) 62%, transparent 68%),
                repeating-radial-gradient(circle, #1a1a1a 0 1px, #0a0a0a 1px 3px);
            animation: spin 1.8s linear infinite;
            animation-play-state: paused;
        }

        .playing .record {
            animation-play-state: running;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .label {
            position: absolute;
            inset: 32%;
            border-radius: 50%;
            overflow: hidden;
            background: var(--green);
        }

        .label img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .label::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 9%;
            height: 9%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: var(--bg);
        }

        .pivot {
            position: absolute;
            left: 86cqw;
            top: 10.5cqw;
            width: 9cqw;
            height: 9cqw;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, #e6e6e6 0%, #b3b3b3 55%, #6a6a6a 100%);
            box-shadow: 0 0.6cqw 1.2cqw rgba(0, 0, 0, .5);
        }

        .arm {
            position: absolute;
            left: 86cqw;
            top: 10.5cqw;
            width: 1.5cqw;
            height: 46.4cqw;
            margin-left: -0.75cqw;
            border-radius: 1cqw;
            background: linear-gradient(90deg, #8a8a8a, #f0f0f0 45%, #8a8a8a);
            transform-origin: 50% 0;
            transform: rotate(8deg);
            transition: transform .9s cubic-bezier(.3, .7, .2, 1);
            box-shadow: 0.4cqw 0.6cqw 0.8cqw rgba(0, 0, 0, .45);
        }

        .arm::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -1cqw;
            width: 4cqw;
            height: 6.5cqw;
            transform: translateX(-50%);
            border-radius: 0.6cqw;
            background: #000;
        }

        .playing .arm {
            transform: rotate(42deg);
        }

        .transport-bar {
            margin-top: 16px;
            padding: 14px 18px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 18px;
            align-items: center;
        }

        .transport {
            display: flex;
            align-items: center;
            gap: 6px;
            grid-row: span 2;
        }

        .transport button {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 50%;
            background: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
        }

        .transport button:hover {
            color: var(--text);
        }

        .transport .play {
            width: 54px;
            height: 54px;
            background: var(--green);
            color: #000;
            font-size: 1.2rem;
        }

        .transport .play:hover {
            background: var(--green-bright);
            color: #000;
            transform: scale(1.04);
        }

        .now {
            min-width: 0;
        }

        .now strong {
            display: block;
            font-weight: 600;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now span {
            font-size: .9rem;
            color: var(--muted);
        }

        .progress {
            height: 4px;
            border-radius: 2px;
            background: #4d4d4d;
            overflow: hidden;
        }

        .progress i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--green);
        }

        /* Search and track list */
        .playout {
            padding: 20px 14px 10px;
        }

        .playout h2,
        .console h2 {
            margin: 0 0 14px;
            padding: 0 6px;
            font: 800 1.4rem/1.2 "Figtree", sans-serif;
            letter-spacing: -0.01em;
        }

        .search {
            display: flex;
            gap: 8px;
            margin: 0 6px 10px;
        }

        .search input {
            flex: 1;
            min-width: 0;
            padding: 11px 18px;
            border: 0;
            border-radius: 999px;
            background: var(--hover);
        }

        .search input::placeholder {
            color: var(--muted);
        }

        .search button {
            padding: 11px 22px;
            border: 0;
            border-radius: 999px;
            background: var(--text);
            color: #000;
            font-weight: 800;
            cursor: pointer;
        }

        .search button:hover {
            transform: scale(1.03);
        }

        .status {
            margin: 0 6px 4px;
            min-height: 1.5em;
            font-size: .95rem;
            color: var(--muted);
        }

        .tracks {
            list-style: none;
            margin: 0;
            padding: 0;
            counter-reset: track-number;
        }

        .tracks li {
            counter-increment: track-number;
        }

        .tracks button {
            width: 100%;
            display: grid;
            grid-template-columns: 2ch 40px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 7px 10px;
            border: 0;
            border-radius: 6px;
            background: none;
            text-align: left;
            cursor: pointer;
        }

        .tracks button::before {
            content: counter(track-number);
            text-align: right;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .tracks img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: block;
            background: var(--raised);
        }

        .tracks button:hover:not(:disabled) {
            background: var(--hover);
        }

        .tracks button:disabled {
            opacity: .4;
            cursor: default;
        }

        .tracks [aria-current="true"] {
            background: var(--hover);
        }

        .tracks [aria-current="true"] b,
        .tracks [aria-current="true"]::before {
            color: var(--green);
        }

        .tracks b {
            display: block;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tracks span {
            min-width: 0;
        }

        .tracks small {
            font-size: .88rem;
            color: var(--muted);
        }

        .tracks time {
            color: var(--muted);
            font-size: .9rem;
            font-variant-numeric: tabular-nums;
        }

        /* Mixing desk: one channel per station */
        .console {
            grid-column: 1 / -1;
            padding: 20px 18px 22px;
        }

        .strips {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 2px 6px 6px;
        }

        .strip {
            flex: 0 0 104px;
            display: grid;
            justify-items: center;
            gap: 12px;
            padding: 14px 8px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: var(--raised);
            cursor: pointer;
        }

        .strip:hover {
            background: #333;
        }

        .strip .name {
            width: 100%;
            min-height: 2.6em;
            font-size: .86rem;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            overflow: hidden;
        }

        .strip .slot {
            position: relative;
            width: 6px;
            height: 80px;
            border-radius: 3px;
            background: #000;
        }

        .strip .knob {
            position: absolute;
            left: 50%;
            bottom: 8%;
            width: 30px;
            height: 14px;
            transform: translateX(-50%);
            border-radius: 7px;
            background: var(--muted);
            transition: bottom .35s cubic-bezier(.3, .7, .2, 1), background .2s;
        }

        .strip .lamp {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #535353;
        }

        .strip[aria-pressed="true"] {
            border-color: var(--green);
        }

        .strip[aria-pressed="true"] .knob {
            bottom: 70%;
            background: var(--text);
        }

        .strip[aria-pressed="true"] .lamp {
            background: var(--green);
            box-shadow: 0 0 10px rgba(29, 185, 84, .9);
        }

        .console p {
            margin: 0;
            padding: 0 6px;
            max-width: 52ch;
            color: var(--muted);
        }

        @media (max-width: 860px) {
            .studio {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            h1 {
                margin-right: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .record {
                animation: none;
            }

            .arm,
            .strip .knob,
            .meter i {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="studio">
        <header class="wall card">
            <div class="clock">
                <time id="clock">00:00:00</time>
                <span id="date"></span>
            </div>
            <div class="meters" aria-hidden="true">
                <div class="meter"><i></i></div>
                <div class="meter"><i></i></div>
                <div class="meter"><i></i></div>
                <div class="meter"><i></i></div>
            </div>
            <h1>Radio Gaga</h1>
            <div class="onair">On air</div>
        </header>

        <section aria-label="Turntable">
            <div class="deck">
                <div class="platter">
                    <div class="record">
                        <div class="label"><img id="cover" alt="" hidden></div>
                    </div>
                </div>
                <div class="arm"></div>
                <div class="pivot"></div>
            </div>

            <div class="transport-bar card">
                <div class="transport">
                    <button type="button" id="prev" aria-label="Previous track">&#9198;</button>
                    <button type="button" id="toggle" class="play" aria-label="Play">&#9654;</button>
                    <button type="button" id="next" aria-label="Next track">&#9197;</button>
                </div>
                <div class="now" aria-live="polite">
                    <strong id="nowTitle">Pick a track</strong>
                    <span id="nowArtist">Each track plays for 30 seconds.</span>
                </div>
                <div class="progress"><i id="bar"></i></div>
            </div>
        </section>

        <section class="playout card" aria-label="Tracks">
            <h2>Tracks</h2>
            <form class="search" id="searchForm">
                <input id="q" type="search" placeholder="Artist or track" aria-label="Search for an artist or track"
                    required>
                <button type="submit">Search</button>
            </form>
            <p class="status" id="status" role="status"></p>
            <ol class="tracks" id="tracks"></ol>
        </section>

        <section class="console card" aria-label="Stations">
            <h2>Stations</h2>
            <div class="strips" id="presets"></div>
            <p id="presetsEmpty" hidden>No stations yet. Create one from the terminal, then reload this page.</p>
        </section>
    </main>

    <audio id="audio" preload="none"></audio>

    <script>
        const $ = (id) => document.getElementById(id);
        const audio = $("audio");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let tracks = [];
        let current = -1;

        // Talks to the backend. On error, shows the "detail" field of the ProblemDetail.
        async function api(path) {
            const response = await fetch(path);
            if (!response.ok) {
                let detail = "Something went wrong. Try again.";
                try { detail = (await response.json()).detail || detail; } catch (e) { }
                throw new Error(detail);
            }
            return response.json();
        }

        function formatTime(seconds) {
            return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
        }

        /* Clock */
        function tick() {
            const now = new Date();
            $("clock").textContent = now.toLocaleTimeString("en-GB");
            $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
        }
        tick();
        setInterval(tick, 1000);

        /* Meters: decorative animation, not a measure of the real audio */
        const meterCovers = document.querySelectorAll(".meter i");
        let meterTimer = null;
        function startMeters() {
            stopMeters();
            if (reducedMotion) {
                meterCovers.forEach((cover) => { cover.style.height = "40%"; });
                return;
            }
            meterTimer = setInterval(() => {
                meterCovers.forEach((cover) => { cover.style.height = (15 + Math.random() * 45) + "%"; });
            }, 140);
        }
        function stopMeters() {
            clearInterval(meterTimer);
            meterTimer = null;
            meterCovers.forEach((cover) => { cover.style.height = "100%"; });
        }

        async function search(query) {
            $("status").textContent = "Searching…";
            try {
                tracks = await api("/search?q=" + encodeURIComponent(query));
                current = -1;
                renderTracks();
                $("status").textContent = tracks.length ? "" : "No results for “" + query + "”.";
            } catch (error) {
                tracks = [];
                renderTracks();
                $("status").textContent = error.message;
            }
        }

        // textContent instead of innerHTML: titles come from outside and must not be parsed as HTML.
        function renderTracks() {
            const list = $("tracks");
            list.replaceChildren();
            tracks.forEach((track, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.disabled = !track.previewUrl;

                const thumb = document.createElement("img");
                thumb.src = track.coverUrl;
                thumb.alt = "";
                thumb.loading = "lazy";

                const text = document.createElement("span");
                const title = document.createElement("b");
                title.textContent = track.title;
                const artist = document.createElement("small");
                artist.textContent = track.previewUrl ? track.artist : track.artist + " (no preview)";
                text.append(title, artist);

                const time = document.createElement("time");
                time.textContent = formatTime(track.durationSeconds);

                button.append(thumb, text, time);
                button.addEventListener("click", () => play(index));

                const item = document.createElement("li");
                item.append(button);
                list.append(item);
            });
        }

        function play(index) {
            const track = tracks[index];
            if (!track || !track.previewUrl) return;
            current = index;

            audio.src = track.previewUrl;
            audio.play().catch(() => { $("status").textContent = "This track could not be played."; });

            $("cover").src = track.coverUrl;
            $("cover").hidden = false;
            $("nowTitle").textContent = track.title;
            $("nowArtist").textContent = track.artist + ", " + track.album;

            document.querySelectorAll("#tracks button").forEach((button, i) => {
                button.setAttribute("aria-current", i === index ? "true" : "false");
            });
        }

        function step(direction) {
            for (let i = current + direction; i >= 0 && i < tracks.length; i += direction) {
                if (tracks[i].previewUrl) return play(i);
            }
        }

        audio.addEventListener("play", () => {
            document.body.classList.add("playing");
            startMeters();
            $("toggle").innerHTML = "&#9208;";
            $("toggle").setAttribute("aria-label", "Pause");
        });
        audio.addEventListener("pause", () => {
            document.body.classList.remove("playing");
            stopMeters();
            $("toggle").innerHTML = "&#9654;";
            $("toggle").setAttribute("aria-label", "Play");
        });
        audio.addEventListener("ended", () => step(1));
        audio.addEventListener("timeupdate", () => {
            const share = audio.duration ? audio.currentTime / audio.duration : 0;
            $("bar").style.width = (share * 100) + "%";
        });

        $("toggle").addEventListener("click", () => {
            if (current === -1) return step(1);
            audio.paused ? audio.play() : audio.pause();
        });
        $("next").addEventListener("click", () => step(1));
        $("prev").addEventListener("click", () => step(-1));

        $("searchForm").addEventListener("submit", (event) => {
            event.preventDefault();
            search($("q").value.trim());
        });

        // Each station is a mixer channel. For now, opening a channel searches tracks by its name.
        async function loadStations() {
            try {
                const stations = await api("/stations");
                $("presetsEmpty").hidden = stations.length > 0;
                stations.forEach((station) => {
                    const strip = document.createElement("button");
                    strip.type = "button";
                    strip.className = "strip";
                    strip.setAttribute("aria-pressed", "false");

                    const name = document.createElement("span");
                    name.className = "name";
                    name.textContent = station.name;

                    const slot = document.createElement("span");
                    slot.className = "slot";
                    const knob = document.createElement("span");
                    knob.className = "knob";
                    slot.append(knob);

                    const lamp = document.createElement("span");
                    lamp.className = "lamp";

                    strip.append(name, slot, lamp);
                    strip.addEventListener("click", () => {
                        document.querySelectorAll(".strip")
                            .forEach((other) => other.setAttribute("aria-pressed", String(other === strip)));
                        $("q").value = station.name;
                        search(station.name);
                    });
                    $("presets").append(strip);
                });
            } catch (error) {
                $("presetsEmpty").textContent = error.message;
                $("presetsEmpty").hidden = false;
            }
        }

        loadStations();
        $("q").value = "Queen";
        search("Queen");
    </script>
</body>

</html>
