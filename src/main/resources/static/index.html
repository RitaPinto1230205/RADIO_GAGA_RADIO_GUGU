<!doctype html>
<html lang="pt">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radio Gaga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --wall: #1d3a3f;
            --wall-deep: #142a2e;
            --walnut: #7a4a2b;
            --walnut-dark: #4f2f1b;
            --alu: #c9cdc8;
            --ink: #14100e;
            --paper: #f1ead9;
            --paper-dim: #d9cfb8;
            --lamp: #f0b34a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(120% 90% at 30% 0%, var(--wall) 0%, var(--wall-deep) 100%);
            color: var(--paper);
            font: 400 1rem/1.5 "Barlow", system-ui, sans-serif;
        }

        button,
        input {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--lamp);
            outline-offset: 3px;
        }

        .page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 56px;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
            gap: 40px;
            align-items: start;
        }

        h1 {
            grid-column: 1 / -1;
            margin: 0;
            font: 600 clamp(2.6rem, 7vw, 4.5rem)/0.95 "Barlow Condensed", sans-serif;
            letter-spacing: 0.01em;
        }

        /* Gira-discos */
        .deck {
            container-type: inline-size;
            position: relative;
            aspect-ratio: 4 / 3;
            border-radius: 14px;
            background:
                repeating-linear-gradient(92deg, rgba(0, 0, 0, .10) 0 2px, transparent 2px 9px),
                linear-gradient(180deg, var(--walnut) 0%, var(--walnut-dark) 100%);
            box-shadow: 0 30px 60px rgba(0, 0, 0, .45), inset 0 2px 0 rgba(255, 255, 255, .12);
        }

        .platter {
            position: absolute;
            left: 6cqw;
            top: 7.5cqw;
            width: 60cqw;
            height: 60cqw;
            border-radius: 50%;
            background: radial-gradient(circle, #8d918c 0%, var(--alu) 60%, #7f837e 100%);
            box-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, .5);
        }

        .record {
            position: absolute;
            inset: 2cqw;
            border-radius: 50%;
            background:
                conic-gradient(from 20deg, transparent 0 8%, rgba(255, 255, 255, .10) 12%, transparent 18% 58%, rgba(255, 255, 255, .08) 62%, transparent 68%),
                repeating-radial-gradient(circle, #1d1816 0 1px, var(--ink) 1px 3px);
            animation: spin 1.8s linear infinite;
            animation-play-state: paused;
        }

        .playing .record {
            animation-play-state: running;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .label {
            position: absolute;
            inset: 32%;
            border-radius: 50%;
            overflow: hidden;
            background: var(--lamp);
        }

        .label img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .label::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 9%;
            height: 9%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: var(--alu);
            box-shadow: 0 0 0 0.4cqw rgba(0, 0, 0, .35);
        }

        .pivot {
            position: absolute;
            left: 86cqw;
            top: 10.5cqw;
            width: 9cqw;
            height: 9cqw;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, #f3f4f1 0%, var(--alu) 55%, #6f736e 100%);
            box-shadow: 0 0.6cqw 1.2cqw rgba(0, 0, 0, .45);
        }

        .arm {
            position: absolute;
            left: 86cqw;
            top: 10.5cqw;
            width: 1.5cqw;
            height: 46.4cqw;
            margin-left: -0.75cqw;
            border-radius: 1cqw;
            background: linear-gradient(90deg, #8b8f8a, #eef0ec 45%, #8b8f8a);
            transform-origin: 50% 0;
            transform: rotate(8deg);
            transition: transform .9s cubic-bezier(.3, .7, .2, 1);
            box-shadow: 0.4cqw 0.6cqw 0.8cqw rgba(0, 0, 0, .35);
        }

        .arm::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -1cqw;
            width: 4cqw;
            height: 6.5cqw;
            transform: translateX(-50%);
            border-radius: 0.6cqw;
            background: var(--ink);
        }

        .playing .arm {
            transform: rotate(42deg);
        }

        /* Painel de controlo */
        .faceplate {
            margin-top: 18px;
            padding: 16px 18px;
            border-radius: 10px;
            background: linear-gradient(180deg, #dfe2dd, #b4b8b3);
            color: var(--ink);
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 18px;
            align-items: center;
        }

        .transport {
            display: flex;
            gap: 8px;
            grid-row: span 2;
        }

        .transport button {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, .35);
            background: linear-gradient(180deg, #fafbf8, #c3c7c2);
            cursor: pointer;
            font-size: 1.05rem;
        }

        .transport button:active {
            background: linear-gradient(180deg, #c3c7c2, #e6e8e4);
        }

        .transport .play {
            width: 54px;
            height: 54px;
            background: linear-gradient(180deg, #ffd27a, var(--lamp));
        }

        .now {
            min-width: 0;
        }

        .now strong {
            display: block;
            font: 600 1.35rem/1.15 "Barlow Condensed", sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now span {
            font-size: .92rem;
        }

        .progress {
            height: 4px;
            border-radius: 2px;
            background: rgba(0, 0, 0, .22);
            overflow: hidden;
        }

        .progress i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--ink);
        }

        /* Estações: mostrador do rádio */
        .dial {
            margin-top: 22px;
        }

        .dial h2,
        .sleeve h2 {
            margin: 0 0 10px;
            font: 600 1.25rem/1.2 "Barlow Condensed", sans-serif;
        }

        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .presets button {
            padding: 7px 14px 8px;
            border: 0;
            border-bottom: 3px solid transparent;
            border-radius: 4px 4px 0 0;
            background: rgba(0, 0, 0, .28);
            cursor: pointer;
        }

        .presets button[aria-pressed="true"] {
            border-bottom-color: var(--lamp);
            color: var(--lamp);
        }

        .dial p {
            margin: 0;
            color: var(--paper-dim);
            font-size: .95rem;
            max-width: 46ch;
        }

        /* Lista de músicas: contracapa do disco */
        .sleeve {
            background: var(--paper);
            color: var(--ink);
            border-radius: 4px;
            padding: 24px 24px 12px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, .4);
        }

        .search {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .search input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid var(--ink);
            border-radius: 3px;
            background: #fffaf0;
        }

        .search button {
            padding: 10px 18px;
            border: 1px solid var(--ink);
            border-radius: 3px;
            background: var(--ink);
            color: var(--paper);
            cursor: pointer;
        }

        .status {
            margin: 0 0 8px;
            min-height: 1.5em;
            font-size: .95rem;
        }

        .tracks {
            list-style: none;
            margin: 0;
            padding: 0;
            counter-reset: faixa;
        }

        .tracks li {
            border-top: 1px solid rgba(20, 16, 14, .22);
            counter-increment: faixa;
        }

        .tracks button {
            width: 100%;
            display: grid;
            grid-template-columns: 2.2ch 1fr auto;
            gap: 12px;
            align-items: baseline;
            padding: 10px 4px;
            border: 0;
            background: none;
            text-align: left;
            cursor: pointer;
        }

        .tracks button::before {
            content: counter(faixa);
            font: 500 1.05rem "Barlow Condensed", sans-serif;
            text-align: right;
            opacity: .6;
        }

        .tracks button:hover:not(:disabled) {
            background: rgba(240, 179, 74, .28);
        }

        .tracks button:disabled {
            opacity: .45;
            cursor: default;
        }

        .tracks [aria-current="true"] {
            background: var(--lamp);
        }

        .tracks b {
            display: block;
            font-weight: 500;
        }

        .tracks small {
            font-size: .9rem;
            opacity: .75;
        }

        .tracks time {
            font: 500 1.05rem "Barlow Condensed", sans-serif;
        }

        @media (max-width: 860px) {
            .page {
                grid-template-columns: 1fr;
                gap: 28px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .record {
                animation: none;
            }

            .arm {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <h1>Radio Gaga</h1>

        <section aria-label="Gira-discos">
            <div class="deck" id="deck">
                <div class="platter">
                    <div class="record">
                        <div class="label"><img id="cover" alt="" hidden></div>
                    </div>
                </div>
                <div class="arm"></div>
                <div class="pivot"></div>
            </div>

            <div class="faceplate">
                <div class="transport">
                    <button type="button" id="prev" aria-label="Música anterior">&#9198;</button>
                    <button type="button" id="toggle" class="play" aria-label="Tocar">&#9654;</button>
                    <button type="button" id="next" aria-label="Música seguinte">&#9197;</button>
                </div>
                <div class="now" aria-live="polite">
                    <strong id="nowTitle">Escolhe uma música</strong>
                    <span id="nowArtist">Cada música toca 30 segundos.</span>
                </div>
                <div class="progress"><i id="bar"></i></div>
            </div>

            <div class="dial">
                <h2>Estações</h2>
                <div class="presets" id="presets"></div>
                <p id="presetsEmpty" hidden>Ainda não há estações. Cria a primeira com um POST para /stations.</p>
            </div>
        </section>

        <section class="sleeve" aria-label="Músicas">
            <h2>Músicas</h2>
            <form class="search" id="searchForm">
                <input id="q" type="search" placeholder="Artista ou música" aria-label="Procurar artista ou música"
                    required>
                <button type="submit">Procurar</button>
            </form>
            <p class="status" id="status" role="status"></p>
            <ol class="tracks" id="tracks"></ol>
        </section>
    </main>

    <audio id="audio" preload="none"></audio>

    <script>
        const $ = (id) => document.getElementById(id);
        const audio = $("audio");
        let tracks = [];
        let current = -1;

        // Fala com o backend. Em caso de erro, mostra o "detail" do ProblemDetail.
        async function api(path) {
            const response = await fetch(path);
            if (!response.ok) {
                let detail = "Algo correu mal. Tenta outra vez.";
                try { detail = (await response.json()).detail || detail; } catch (e) { }
                throw new Error(detail);
            }
            return response.json();
        }

        function formatTime(seconds) {
            return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
        }

        async function search(query) {
            $("status").textContent = "A procurar…";
            try {
                tracks = await api("/search?q=" + encodeURIComponent(query));
                current = -1;
                renderTracks();
                $("status").textContent = tracks.length ? "" : "Não encontrámos nada para “" + query + "”.";
            } catch (error) {
                tracks = [];
                renderTracks();
                $("status").textContent = error.message;
            }
        }

        // textContent em vez de innerHTML: os títulos vêm de fora e não devem ser lidos como HTML.
        function renderTracks() {
            const list = $("tracks");
            list.replaceChildren();
            tracks.forEach((track, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.disabled = !track.previewUrl;

                const text = document.createElement("span");
                const title = document.createElement("b");
                title.textContent = track.title;
                const artist = document.createElement("small");
                artist.textContent = track.previewUrl ? track.artist : track.artist + " (sem preview)";
                text.append(title, artist);

                const time = document.createElement("time");
                time.textContent = formatTime(track.durationSeconds);

                button.append(text, time);
                button.addEventListener("click", () => play(index));

                const item = document.createElement("li");
                item.append(button);
                list.append(item);
            });
        }

        function play(index) {
            const track = tracks[index];
            if (!track || !track.previewUrl) return;
            current = index;

            audio.src = track.previewUrl;
            audio.play().catch(() => { $("status").textContent = "Não foi possível tocar esta música."; });

            $("cover").src = track.coverUrl;
            $("cover").hidden = false;
            $("nowTitle").textContent = track.title;
            $("nowArtist").textContent = track.artist + ", " + track.album;

            document.querySelectorAll("#tracks button").forEach((button, i) => {
                button.setAttribute("aria-current", i === index ? "true" : "false");
            });
        }

        function step(direction) {
            for (let i = current + direction; i >= 0 && i < tracks.length; i += direction) {
                if (tracks[i].previewUrl) return play(i);
            }
        }

        audio.addEventListener("play", () => {
            $("deck").classList.add("playing");
            $("toggle").innerHTML = "&#9208;";
            $("toggle").setAttribute("aria-label", "Pausar");
        });
        audio.addEventListener("pause", () => {
            $("deck").classList.remove("playing");
            $("toggle").innerHTML = "&#9654;";
            $("toggle").setAttribute("aria-label", "Tocar");
        });
        audio.addEventListener("ended", () => step(1));
        audio.addEventListener("timeupdate", () => {
            const share = audio.duration ? audio.currentTime / audio.duration : 0;
            $("bar").style.width = (share * 100) + "%";
        });

        $("toggle").addEventListener("click", () => {
            if (current === -1) return step(1);
            audio.paused ? audio.play() : audio.pause();
        });
        $("next").addEventListener("click", () => step(1));
        $("prev").addEventListener("click", () => step(-1));

        $("searchForm").addEventListener("submit", (event) => {
            event.preventDefault();
            search($("q").value.trim());
        });

        // Por agora, sintonizar uma estação procura músicas pelo nome dela.
        async function loadStations() {
            try {
                const stations = await api("/stations");
                $("presetsEmpty").hidden = stations.length > 0;
                stations.forEach((station) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.textContent = station.name;
                    button.setAttribute("aria-pressed", "false");
                    button.addEventListener("click", () => {
                        document.querySelectorAll("#presets button")
                            .forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
                        $("q").value = station.name;
                        search(station.name);
                    });
                    $("presets").append(button);
                });
            } catch (error) {
                $("presetsEmpty").textContent = error.message;
                $("presetsEmpty").hidden = false;
            }
        }

        loadStations();
        $("q").value = "Queen";
        search("Queen");
    </script>
</body>

</html>
