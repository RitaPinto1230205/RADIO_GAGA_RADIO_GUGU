spring.application.name=radiogaga
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:radiogaga}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

deezer.base-url=${DEEZER_BASE_URL:https://api.deezer.com}
deezer.timeout-seconds=${DEEZER_TIMEOUT_SECONDS:3}

radiogaga.api-key=${RADIOGAGA_API_KEY}

