services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: radiogaga
      POSTGRES_USER: radiogaga
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiogaga -d radiogaga"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
       - "8080:8080"
       - "127.0.0.1:8081:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/radiogaga
      DATABASE_USERNAME: radiogaga
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      RADIOGAGA_API_KEY: ${RADIOGAGA_API_KEY:?Set RADIOGAGA_API_KEY in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: